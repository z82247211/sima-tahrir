<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدرسه | سامانه جوایز</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#263238}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eee8ff,#eef9ff)}.box{background:#fff;border-radius:20px;padding:22px;box-shadow:0 6px 25px #0001}.login .box{width:min(430px,92%)}input,button{width:100%;padding:12px;margin:6px 0;border-radius:12px;font:inherit}input{border:1px solid #ddd}button{border:0;background:#765cff;color:#fff;cursor:pointer}.bar{background:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px}.content{max-width:1200px;margin:auto;padding:24px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{width:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{padding:18px}.stat strong{display:block;font-size:28px;margin-top:8px}.muted{color:#718096;font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px}.modal .box{width:min(500px,100%)}.msg{min-height:24px}.danger{background:#777}.item{margin-top:10px}</style></head><body><div id="login" class="login"><div class="box"><h1>🏫 پنل مدرسه</h1><p>ورود مدیر مدرسه</p><form id="loginForm"><input id="username" placeholder="نام کاربری" required><input id="password" type="password" placeholder="رمز عبور" required><button>ورود</button></form><div id="loginMsg" class="msg"></div></div></div><div id="app" class="hidden"><header class="bar"><div><b id="schoolName">🏫 مدرسه</b><div id="schoolCode" class="muted"></div></div><button id="logout" class="danger" style="width:auto">خروج</button></header><main class="content"><div class="nav"><button data-tab="classes">🏷️ کلاس‌ها</button><button data-tab="students">👨‍🎓 دانش‌آموزان</button><button data-tab="rewards">🎁 جوایز مشترک</button><button data-tab="requests">📋 درخواست‌ها</button></div><section id="classes" class="tab"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2>🏷️ کلاس‌های این مدرسه</h2><p class="muted">فقط کلاس‌های مدرسه شما نمایش داده می‌شود.</p></div><button id="addClass" style="width:auto">➕ کلاس جدید</button></div></div><div id="classList" class="grid" style="margin-top:15px"></div></section><section id="students" class="tab hidden"><div class="box"><h2>👨‍🎓 دانش‌آموزان</h2><p class="muted">دانش‌آموزان این مدرسه</p></div><div id="studentList" class="grid" style="margin-top:15px"></div></section><section id="rewards" class="tab hidden"><div class="box"><h2>🎁 جوایز مشترک</h2><p class="muted">این جوایز از انبار مرکزی برای همه مدارس یکسان هستند.</p></div><div id="rewardList" class="grid" style="margin-top:15px"></div></section><section id="requests" class="tab hidden"><div class="box"><h2>📋 درخواست‌های جایزه</h2><p class="muted">فقط درخواست‌های دانش‌آموزان این مدرسه</p></div><div id="requestList" class="grid" style="margin-top:15px"></div></section></main></div><div id="modal" class="modal hidden"><div class="box"><h2>➕ افزودن کلاس</h2><form id="classForm"><input id="className" placeholder="نام کلاس" required><div id="classMsg" class="msg"></div><button>ذخیره</button><button type="button" id="cancel" class="danger">انصراف</button></form></div></div><script>const API='https://ubjsvqhxoufdjwzqkmsd.supabase.co/functions/v1/school-api';let token=sessionStorage.getItem('school_session')||'';const e=id=>document.getElementById(id),fa=n=>Number(n||0).toLocaleString('fa-IR');function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}async function call(action,data={}){const h={'Content-Type':'application/json',Authorization:'Bearer '+token};const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({error:'پاسخ نامعتبر'}));if(!r.ok)throw Error(j.error||'خطا');return j}async function loadSchool(){const j=await call('school_me');e('schoolName').textContent='🏫 '+j.school.name;e('schoolCode').textContent='کد مدرسه: '+j.school.code}async function loadClasses(){const j=await call('school_admin_classes');e('classList').innerHTML=(j.classes||[]).map(c=>`<article class="box card"><h3>🏷️ ${esc(c.name)}</h3><div class="muted">کلاس متعلق به همین مدرسه</div></article>`).join('')||'<div class="box">هنوز کلاسی ثبت نشده است.</div>'}async function loadStudents(){const j=await call('school_admin_students');e('studentList').innerHTML=(j.students||[]).map(s=>`<article class="box card"><h3>👨‍🎓 ${esc(s.full_name)}</h3><div>نام کاربری: ${esc(s.username)}</div><div>امتیاز: <b>${fa(s.points)}</b></div></article>`).join('')||'<div class="box">دانش‌آموزی ثبت نشده است.</div>'}async function loadRewards(){const j=await call('school_admin_rewards');e('rewardList').innerHTML=(j.rewards||[]).map(r=>`<article class="box card"><h3>${esc(r.emoji||'🎁')} ${esc(r.name)}</h3><div>امتیاز لازم: <b>${fa(r.points_required)}</b></div><div>موجودی مرکزی: <b>${fa(r.central_stock)}</b></div></article>`).join('')||'<div class="box">جایزه‌ای ثبت نشده است.</div>'}async function loadRequests(){const j=await call('school_admin_requests');e('requestList').innerHTML=(j.requests||[]).map(r=>`<article class="box card"><h3>📋 ${esc(r.rewards?.name||'جایزه')}</h3><div>دانش‌آموز: ${esc(r.students?.full_name||'')}</div><div>وضعیت: <b>${esc(r.status)}</b></div></article>`).join('')||'<div class="box">درخواستی وجود ندارد.</div>'}function showTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));e(id).classList.remove('hidden');if(id==='classes')loadClasses();if(id==='students')loadStudents();if(id==='rewards')loadRewards();if(id==='requests')loadRequests()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));e('addClass').onclick=()=>{e('className').value='';e('classMsg').textContent='';e('modal').classList.remove('hidden')};e('cancel').onclick=()=>e('modal').classList.add('hidden');e('classForm').onsubmit=async x=>{x.preventDefault();e('classMsg').textContent='⏳ در حال ذخیره...';try{await call('school_admin_add_class',{name:e('className').value});e('modal').classList.add('hidden');loadClasses()}catch(x){e('classMsg').textContent='❌ '+x.message}};async function start(){await loadSchool();await loadClasses()}e('loginForm').onsubmit=async x=>{x.preventDefault();e('loginMsg').textContent='⏳ در حال ورود...';try{const j=await callLogin(e('username').value,e('password').value);token=j.token;sessionStorage.setItem('school_session',token);e('login').classList.add('hidden');e('app').classList.remove('hidden');start()}catch(x){e('loginMsg').textContent='❌ '+x.message}};async function callLogin(u,p){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'school_admin_login',username:u,password:p})});const j=await r.json();if(!r.ok)throw Error(j.error||'ورود ناموفق');return j}e('logout').onclick=()=>{sessionStorage.removeItem('school_session');location.reload()};if(token){e('login').classList.add('hidden');e('app').classList.remove('hidden');start().catch(x=>{sessionStorage.removeItem('school_session');location.reload()})}</script></body></html>

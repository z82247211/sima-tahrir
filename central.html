<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مرکزی | سامانه جوایز مدارس</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f7fb;color:#263238}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eee8ff,#eef9ff)}.box{background:#fff;border-radius:20px;padding:22px;box-shadow:0 6px 25px #0001}.login .box{width:min(430px,92%)}input,button{width:100%;padding:12px;margin:6px 0;border-radius:12px;font:inherit}input{border:1px solid #ddd}button{border:0;background:#765cff;color:#fff;cursor:pointer}.bar{background:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.content{max-width:1200px;margin:auto;padding:24px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{width:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{padding:18px}.stat strong{display:block;font-size:30px;margin-top:8px}.muted{color:#718096;font-size:13px}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#e9f8ee;color:#218344;font-size:12px}.off{background:#f4f4f4;color:#777}.msg{min-height:24px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px}.modal .box{width:min(500px,100%)}.danger{background:#777}</style></head><body><div id="login" class="login"><div class="box"><h1>🎓 پنل مرکزی</h1><p>مدیریت کل سامانه جوایز مدارس</p><form id="loginForm"><input id="username" placeholder="نام کاربری مدیر کل" required><input id="password" type="password" placeholder="رمز عبور" required><button>ورود به پنل مرکزی</button></form><div id="loginMsg" class="msg"></div></div></div><div id="app" class="hidden"><header class="bar"><b>🎓 پنل مرکزی سامانه</b><button id="logout" class="danger" style="width:auto">خروج</button></header><main class="content"><div class="nav"><button data-tab="schools">🏫 مدارس</button><button data-tab="rewards">🎁 جوایز مشترک</button></div><section id="schools" class="tab"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><div><h2>🏫 مدیریت مدارس</h2><p class="muted">هر مدرسه پنل اختصاصی خودش را دارد.</p></div><button id="add" style="width:auto">➕ افزودن مدرسه</button></div><div class="grid" style="margin-top:15px"><div class="box card">🏫 مدارس<strong id="sc">۰</strong></div><div class="box card">🏷️ کلاس‌ها<strong id="cc">۰</strong></div><div class="box card">👨‍🎓 دانش‌آموزان<strong id="stc">۰</strong></div><div class="box card">👩‍🏫 معلم‌ها<strong id="tc">۰</strong></div></div><div id="list" class="grid" style="margin-top:15px"></div></section><section id="rewards" class="tab hidden"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><div><h2>🎁 جوایز مشترک</h2><p class="muted">موجودی این بخش برای تمام مدارس مشترک است.</p></div><button id="refreshRewards" style="width:auto">🔄 بروزرسانی</button></div><div id="rewardList" class="grid" style="margin-top:15px"></div></section><div id="msg" class="msg"></div></main></div><div id="modal" class="modal hidden"><div class="box"><h2>➕ افزودن مدرسه</h2><form id="form"><input id="name" placeholder="نام مدرسه" required><input id="code" placeholder="کد مدرسه" required><input id="au" placeholder="نام کاربری مدیر مدرسه" required><input id="ap" type="password" placeholder="رمز عبور مدیر مدرسه" required><input id="af" placeholder="نام مدیر مدرسه"><div id="fm" class="msg"></div><button>ذخیره</button><button type="button" id="cancel" class="danger">انصراف</button></form></div></div><script>const API='https://ubjsvqhxoufdjwzqkmsd.supabase.co/functions/v1/school-api';let token=sessionStorage.getItem('sima_session')||'';const e=id=>document.getElementById(id),fa=n=>Number(n||0).toLocaleString('fa-IR');function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}async function call(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({error:'پاسخ نامعتبر'}));if(!r.ok)throw Error(j.error||'خطا');return j}async function loadSchools(){try{const j=await call('superadmin_schools'),a=j.schools||[];e('sc').textContent=fa(a.length);e('cc').textContent=fa(a.reduce((n,x)=>n+x.classes_count,0));e('stc').textContent=fa(a.reduce((n,x)=>n+x.students_count,0));e('tc').textContent=fa(a.reduce((n,x)=>n+x.teachers_count,0));e('list').innerHTML=a.map(s=>`<article class="box card"><h3>🏫 ${esc(s.name)}</h3><div class="muted">کد: ${esc(s.code)}</div><p><span class="badge ${s.active?'':'off'}">${s.active?'فعال':'غیرفعال'}</span></p><div>کلاس: ${fa(s.classes_count)} | دانش‌آموز: ${fa(s.students_count)}<br>معلم: ${fa(s.teachers_count)}</div><button onclick="toggle(${s.id},${!s.active})" style="background:${s.active?'#e55b63':'#777'}">${s.active?'غیرفعال کردن':'فعال کردن'}</button></article>`).join('')||'<div class="box">مدرسه‌ای ثبت نشده است.</div>'}catch(x){e('msg').textContent='❌ '+x.message}}async function loadRewards(){try{const j=await call('admin_list_rewards_central'),a=j.rewards||j||[];e('rewardList').innerHTML=(Array.isArray(a)?a:[]).map(r=>`<article class="box card"><h3>${esc(r.emoji||'🎁')} ${esc(r.name)}</h3><div>امتیاز لازم: <b>${fa(r.points_required)}</b></div><div>موجودی مرکزی: <b>${fa(r.central_stock)}</b></div><input id="stock-${r.id}" type="number" min="0" value="${Number(r.central_stock||0)}"><button onclick="saveStock(${r.id})">💾 ذخیره موجودی</button></article>`).join('')||'<div class="box">جایزه‌ای ثبت نشده است.</div>'}catch(x){e('rewardList').innerHTML='<div class="box">❌ '+esc(x.message)+'</div>'}}window.saveStock=async id=>{try{const v=Number(e('stock-'+id).value);await call('admin_update_reward_stock',{p_reward_id:id,p_stock:v});loadRewards()}catch(x){alert(x.message)}};window.toggle=async(id,active)=>{if(!confirm(active?'مدرسه فعال شود؟':'مدرسه غیرفعال شود؟'))return;try{await call('superadmin_update_school',{id,active});loadSchools()}catch(x){alert(x.message)}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));e(b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='schools')loadSchools();if(b.dataset.tab==='rewards')loadRewards()});e('refreshRewards').onclick=loadRewards;e('add').onclick=()=>e('modal').classList.remove('hidden');e('cancel').onclick=()=>e('modal').classList.add('hidden');e('form').onsubmit=async x=>{x.preventDefault();e('fm').textContent='⏳ در حال ذخیره...';try{await call('superadmin_add_school',{name:e('name').value,code:e('code').value,username:e('au').value,password:e('ap').value,full_name:e('af').value});e('modal').classList.add('hidden');x.target.reset();loadSchools()}catch(x){e('fm').textContent='❌ '+x.message}};e('loginForm').onsubmit=async x=>{x.preventDefault();e('loginMsg').textContent='⏳ در حال ورود...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_login',username:e('username').value,password:e('password').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'ورود ناموفق');token=j.token;sessionStorage.setItem('sima_session',token);e('login').classList.add('hidden');e('app').classList.remove('hidden');loadSchools()}catch(x){e('loginMsg').textContent='❌ '+x.message}};e('logout').onclick=()=>{sessionStorage.removeItem('sima_session');location.reload()};if(token){e('login').classList.add('hidden');e('app').classList.remove('hidden');loadSchools()}</script></body></html>

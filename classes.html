<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت کلاس‌ها | سامانه جوایز</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f7fb;color:#263238}.hidden{display:none!important}.box{background:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 25px #0001}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eee8ff,#eef9ff)}.login .box{width:min(430px,92%)}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:12px;font:inherit}input,select{border:1px solid #ddd;background:#fff}button{border:0;background:#765cff;color:#fff;cursor:pointer}.bar{background:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px}.content{max-width:1200px;margin:auto;padding:24px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.toolbar button{width:auto}.schoolSection{margin-top:22px}.schoolHead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.schoolHead h2{margin:0}.schoolCount{background:#eee8ff;color:#654bd8;border-radius:20px;padding:7px 12px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.school{padding:18px}.muted{color:#718096;font-size:13px}.actions{display:flex;gap:8px}.actions button{margin-top:12px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px}.modal .box{width:min(500px,100%)}.msg{min-height:24px}.back{background:#777}</style></head><body><div id="login" class="login"><div class="box"><h1>🎓 سامانه جوایز مدارس</h1><p>ورود مدیر کل</p><form id="loginForm"><input id="username" placeholder="نام کاربری" required><input id="password" type="password" placeholder="رمز عبور" required><button>ورود</button></form><div id="loginMsg" class="msg"></div></div></div><div id="app" class="hidden"><header class="bar"><div><b>🏷️ مدیریت کلاس‌ها</b><div class="muted">کلاس‌های هر مدرسه کاملاً جدا نمایش داده می‌شوند</div></div><button id="logout" style="width:auto;background:#777">خروج</button></header><main class="content"><div class="toolbar"><div><h2>🏷️ کلاس‌ها</h2><p class="muted">هر مدرسه بخش جداگانه خودش را دارد.</p></div><button id="add">➕ افزودن کلاس</button></div><div id="list"></div><div id="msg" class="msg"></div></main></div><div id="modal" class="modal hidden"><div class="box"><h2 id="title">➕ افزودن کلاس</h2><form id="form"><input type="hidden" id="id"><select id="school" required></select><input id="name" placeholder="نام کلاس" required><div id="fm" class="msg"></div><button>ذخیره</button><button type="button" id="cancel" class="back">انصراف</button></form></div></div><script>const API='https://ubjsvqhxoufdjwzqkmsd.supabase.co/functions/v1/school-api';let token=sessionStorage.getItem('sima_session')||'';const e=id=>document.getElementById(id),fa=n=>Number(n||0).toLocaleString('fa-IR');function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}async function call(action,data={}){const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({error:'پاسخ نامعتبر'}));if(!r.ok)throw Error(j.error||'خطا');return j}let schools=[],classes=[];async function load(){try{const [a,b]=await Promise.all([call('superadmin_schools'),call('admin_classes')]);schools=a.schools||[];classes=b.classes||[];render()}catch(x){e('msg').textContent='❌ '+x.message}}function render(){if(!schools.length){e('list').innerHTML='<div class="box">مدرسه‌ای ثبت نشده است.</div>';return}e('list').innerHTML=schools.map(s=>{const arr=classes.filter(c=>Number(c.school_id)===Number(s.id));return `<section class="schoolSection"><div class="box"><div class="schoolHead"><h2>🏫 ${esc(s.name)}</h2><span class="schoolCount">${fa(arr.length)} کلاس</span></div>${arr.length?`<div class="grid">${arr.map(c=>`<article class="box school"><h3>🏷️ ${esc(c.name)}</h3><p>👨‍🎓 دانش‌آموز: <b>${fa(c.students_count)}</b></p><p>👩‍🏫 معلم: <b>${fa(c.teachers_count)}</b></p><div class="actions"><button onclick='edit(${JSON.stringify(c)})'>✏️ ویرایش</button></div></article>`).join('')}</div>`:'<p class="muted">هنوز کلاسی برای این مدرسه ثبت نشده است.</p>'}</div></section>`}).join('')}function openAdd(){e('title').textContent='➕ افزودن کلاس';e('id').value='';e('name').value='';e('school').disabled=false;e('school').innerHTML=schools.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');e('fm').textContent='';e('modal').classList.remove('hidden')}window.edit=c=>{e('title').textContent='✏️ ویرایش کلاس';e('id').value=c.id;e('name').value=c.name;e('school').innerHTML=schools.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');e('school').value=c.school_id;e('school').disabled=true;e('fm').textContent='';e('modal').classList.remove('hidden')};e('add').onclick=openAdd;e('cancel').onclick=()=>e('modal').classList.add('hidden');e('form').onsubmit=async x=>{x.preventDefault();e('fm').textContent='⏳ در حال ذخیره...';try{const data={name:e('name').value};if(e('id').value){await call('superadmin_update_class',{id:Number(e('id').value),name:data.name})}else{await call('superadmin_add_class',{school_id:Number(e('school').value),name:data.name})}e('modal').classList.add('hidden');await load()}catch(x){e('fm').textContent='❌ '+x.message}};e('loginForm').onsubmit=async x=>{x.preventDefault();e('loginMsg').textContent='⏳ در حال ورود...';try{const j=await call('admin_login',{username:e('username').value,password:e('password').value});if(!j.token)throw Error('ورود انجام نشد');token=j.token;sessionStorage.setItem('sima_session',token);e('login').classList.add('hidden');e('app').classList.remove('hidden');load()}catch(x){e('loginMsg').textContent='❌ '+x.message}};e('logout').onclick=()=>{sessionStorage.removeItem('sima_session');location.reload()};if(token){e('login').classList.add('hidden');e('app').classList.remove('hidden');load()}</script></body></html>

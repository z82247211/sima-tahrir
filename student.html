<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMA TAHRIR | دانش‌آموز</title><style>body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(135deg,#fff9f3,#f3f0ff);color:#26313b}.wrap{max-width:1100px;margin:auto;padding:25px}.card{background:#fff;border:1px solid #eee6dd;border-radius:24px;padding:24px;box-shadow:0 15px 45px #5b4a6d14;margin-bottom:18px}.brand{font-weight:900;color:#735be5;font-size:25px}.muted{color:#7b8791;font-size:13px}.login{max-width:420px;margin:80px auto}.field{margin:14px 0}.field label{display:block;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #e3dce9;border-radius:13px;box-sizing:border-box}.btn{width:100%;padding:13px;border:0;border-radius:13px;background:#735be5;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.total{font-size:46px;font-weight:900;color:#735be5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.subject{padding:18px;border-radius:18px;background:#faf8ff;border:1px solid #eee8ff}.reward{padding:18px;border:1px solid #eee6dd;border-radius:18px;text-align:center}.reward img{width:110px;height:110px;object-fit:contain;border-radius:15px}.emoji{font-size:55px}.msg{min-height:22px;font-size:13px}.ok{color:#23824b}.bad{color:#b33b3b}@media(max-width:600px){.hero{display:block}.wrap{padding:15px}}</style></head><body><div class="wrap"><div id="login" class="card login"><div class="brand">🎁 SIMA TAHRIR</div><p class="muted">ورود دانش‌آموز</p><div class="field"><label>نام کاربری</label><input id="u"></div><div class="field"><label>رمز عبور</label><input id="p" type="password"></div><button id="btn" class="btn">ورود</button><div id="msg" class="msg"></div></div><main id="app" class="hidden"><div class="card hero"><div><div class="brand">سلام <span id="name">دانش‌آموز عزیز</span> 👋</div><p id="class" class="muted"></p></div><div><div class="muted">مجموع امتیاز</div><div id="total" class="total">۰</div></div></div><div class="card"><h3>📚 امتیازهای من به تفکیک درس</h3><div id="subjects" class="grid"></div></div><div class="card"><h3>🎁 جوایز قابل دریافت</h3><div id="rewards" class="grid"></div><div id="rewardMsg" class="msg"></div></div></main></div><script>const API='https://znisrmcilqzjicmfsype.supabase.co/functions/v1/sima-tahrir-api';let S=sessionStorage.getItem('student_session')||'';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...(S?{Authorization:'Bearer '+S}:{})},body:JSON.stringify({action,...data})});const x=await r.json();if(!r.ok)throw Error(x.error||'خطا');return x}async function load(){try{const d=await api('student_dashboard');if(!d.student)throw Error('اطلاعات دانش‌آموز پیدا نشد');$('name').textContent=esc(d.student.full_name);$('class').textContent='کلاس: '+esc(d.student.class_name||'بدون کلاس');$('total').textContent=Number(d.total_points||0).toLocaleString('fa-IR');$('subjects').innerHTML=(d.subjects||[]).map(s=>`<div class="subject"><div class="muted">📖 ${esc(s.subject_name)}</div><strong style="font-size:28px">${Number(s.points||0).toLocaleString('fa-IR')}</strong><div class="muted">امتیاز</div></div>`).join('')||'<div class="muted">هنوز امتیازی ثبت نشده است.</div>';const r=await api('student_rewards');$('rewards').innerHTML=(r.rewards||[]).map(x=>`<div class="reward">${x.image_url?`<img src="${esc(x.image_url)}">`:`<div class="emoji">🎁</div>`}<h4>${esc(x.name)}</h4><div class="muted">${Number(x.points_required||0).toLocaleString('fa-IR')} امتیاز</div><button class="btn" style="margin-top:12px" ${x.can_redeem?'':'disabled'} onclick="requestReward(${x.id})">${x.can_redeem?'🎁 درخواست جایزه':'⭐ امتیاز کافی نیست'}</button></div>`).join('')||'<div class="muted">هنوز جایزه‌ای تعریف نشده است.</div>'}catch(e){$('msg').textContent='❌ '+e.message}}async function requestReward(id){try{$('rewardMsg').textContent='⏳ در حال ثبت درخواست...';const x=await api('request_reward',{reward_id:id});$('rewardMsg').className='msg ok';$('rewardMsg').textContent='✅ '+x.message;await load()}catch(e){$('rewardMsg').className='msg bad';$('rewardMsg').textContent='❌ '+e.message}}$('btn').onclick=async()=>{try{$('msg').textContent='⏳ در حال ورود...';const x=await api('login',{username:$('u').value.trim(),password:$('p').value});const p=JSON.parse(atob(x.session.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')));if(p.role!=='student')throw Error('این حساب دانش‌آموز نیست');S=x.session;sessionStorage.setItem('student_session',S);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('msg').textContent='❌ '+e.message}};if(S){try{const p=JSON.parse(atob(S.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')));if(p.role==='student'){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}else{S='';sessionStorage.removeItem('student_session')}}catch{S='';sessionStorage.removeItem('student_session')}}</script></body></html>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMA TAHRIR</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f7fb;color:#263238}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eee8ff,#eef9ff)}.box{background:#fff;border-radius:20px;padding:22px;box-shadow:0 6px 25px #0001}.login .box{width:min(430px,92%)}input,button,select{width:100%;padding:12px;margin:6px 0;border-radius:12px;font:inherit}input,select{border:1px solid #ddd}button{border:0;background:#765cff;color:#fff;cursor:pointer}.bar{background:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.content{max-width:1200px;margin:auto;padding:24px}.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.stat{padding:18px}.stat strong{display:block;font-size:30px;margin-top:8px}.section{margin-top:20px}.msg{min-height:24px;color:#b42318}.muted{color:#718096;font-size:13px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{width:auto;padding:10px 16px}.nav button.active{background:#5946c8}.list{display:grid;gap:10px}.row{background:#fff;border-radius:14px;padding:14px;border:1px solid #eee}@media(max-width:700px){.content{padding:14px}.bar{padding:14px}.nav button{flex:1}} </style></head><body><div id="login" class="login"><div class="box"><h1>🎁 SIMA TAHRIR</h1><p>سامانه مدیریت مدرسه و جوایز</p><form id="loginForm"><input id="username" placeholder="نام کاربری" autocomplete="username" required><input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password" required><button type="submit">ورود به پنل مدیر</button></form><div id="loginMsg" class="msg"></div></div></div><div id="app" class="hidden"><header class="bar"><b>🎓 پنل مدیر — SIMA TAHRIR</b><button id="logout" style="width:auto;background:#777">خروج</button></header><main class="content"><div id="nav" class="nav"><button data-page="home">🏠 داشبورد</button><button data-page="classes">🏷️ کلاس‌ها</button><button data-page="teachers">👩‍🏫 معلم‌ها</button><button data-page="students">👨‍🎓 دانش‌آموزان</button><button data-page="rewards">🎁 جوایز</button></div><section id="home"><h2>🏫 داشبورد مدرسه</h2><p class="muted">اطلاعات از دیتابیس فعلی خوانده می‌شود.</p><div class="stats"><div class="box stat">🏷️ کلاس‌ها<strong id="cc">۰</strong></div><div class="box stat">👨‍🎓 دانش‌آموزان<strong id="sc">۰</strong></div><div class="box stat">👩‍🏫 معلم‌ها<strong id="tc">۰</strong></div><div class="box stat">🎁 جوایز<strong id="rc">۰</strong></div></div><div class="box section"><h3>وضعیت مدرسه</h3><div id="schoolInfo">در حال بارگذاری...</div></div></section><section id="classes" class="hidden"><div class="box"><h2>🏷️ کلاس‌ها</h2><input id="className" placeholder="نام کلاس جدید"><button id="addClass">➕ افزودن کلاس</button><div id="classMsg" class="msg"></div><div id="classList" class="list"></div></div></section><section id="teachers" class="hidden"><div class="grid"><div class="box"><h2>👩‍🏫 تعریف معلم</h2><input id="teacherName" placeholder="نام و نام خانوادگی"><input id="teacherUser" placeholder="نام کاربری"><input id="teacherPass" type="password" placeholder="رمز عبور"><button id="addTeacher">ثبت معلم</button><div id="teacherMsg" class="msg"></div></div><div class="box"><h2>اختصاص معلم به کلاس</h2><select id="teacherSelect"></select><select id="classSelect"></select><button id="assign">اختصاص به کلاس</button><div id="assignMsg" class="msg"></div></div></div><div class="box section"><div id="teacherList" class="list"></div></div></section><section id="students" class="hidden"><div class="box"><h2>👨‍🎓 دانش‌آموزان</h2><div id="studentList" class="list"></div><div id="studentMsg" class="msg"></div></div></section><section id="rewards" class="hidden"><div class="box"><h2>🎁 جوایز</h2><input id="rewardName" placeholder="نام جایزه"><input id="rewardDesc" placeholder="توضیحات"><input id="rewardPoints" type="number" placeholder="امتیاز موردنیاز"><input id="rewardImage" placeholder="آدرس تصویر (اختیاری)"><button id="addReward">ثبت جایزه</button><div id="rewardMsg" class="msg"></div></div><div class="box section"><div id="rewardList" class="list"></div></div></section></main></div><script>const API='https://znisrmcilqzjicmfsype.supabase.co/functions/v1/sima-tahrir-api';let session=sessionStorage.getItem('sima_session')||'';let page='home';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,data={}){const headers={'Content-Type':'application/json'};if(session)headers.Authorization='Bearer '+session;const r=await fetch(API,{method:'POST',headers,body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({error:'پاسخ نامعتبر از سرور'}));if(!r.ok)throw new Error(j.error||'خطا');return j}function show(p){page=p;document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));$(p).classList.remove('hidden');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='home')loadHome();if(p==='classes')loadClasses();if(p==='teachers')loadTeachers();if(p==='students')loadStudents();if(p==='rewards')loadRewards()}async function loadHome(){try{const [c,t,s,r]=await Promise.all([api('classes'),api('teachers'),api('students',{page:1,page_size:1}),api('rewards')]);$('cc').textContent=(c.classes||[]).length.toLocaleString('fa-IR');$('tc').textContent=(t.teachers||[]).length.toLocaleString('fa-IR');$('sc').textContent=Number(s.total||0).toLocaleString('fa-IR');$('rc').textContent=(r.rewards||[]).length.toLocaleString('fa-IR');$('schoolInfo').innerHTML='<b>مدرسه فعال است ✅</b><p>SIMA TAHRIR</p>'}catch(e){$('schoolInfo').innerHTML='<span class="msg">❌ '+esc(e.message)+'</span>'}}async function loadClasses(){try{const x=await api('classes');const a=x.classes||[];$('classList').innerHTML=a.map(c=>'<div class="row">🏷️ <b>'+esc(c.name)+'</b></div>').join('')||'<div class="row">هنوز کلاسی ثبت نشده است.</div>';$('classSelect').innerHTML=a.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')}catch(e){$('classMsg').textContent='❌ '+e.message}}async function loadTeachers(){try{const x=await api('teachers');const a=x.teachers||[];$('teacherSelect').innerHTML=a.map(t=>'<option value="'+t.id+'">'+esc(t.full_name)+'</option>').join('');$('teacherList').innerHTML=a.map(t=>'<div class="row">👩‍🏫 <b>'+esc(t.full_name)+'</b><br><small>نام کاربری: '+esc(t.username)+' | کلاس: '+((t.classes||[]).map(c=>esc(c.name)).join('، ')||'بدون کلاس')+'</small></div>').join('')||'<div class="row">هنوز معلمی ثبت نشده است.</div>'}catch(e){$('teacherMsg').textContent='❌ '+e.message}}async function loadStudents(){try{const x=await api('students',{page:1,page_size:100});const a=x.students||[];$('studentList').innerHTML=a.map(s=>'<div class="row">👨‍🎓 <b>'+esc(s.full_name)+'</b><br><small>نام کاربری: '+esc(s.username||'')+' | کلاس: '+esc(s.class_name||'بدون کلاس')+'</small></div>').join('')||'<div class="row">هنوز دانش‌آموزی ثبت نشده است.</div>'}catch(e){$('studentMsg').textContent='❌ '+e.message}}async function loadRewards(){try{const x=await api('rewards');const a=x.rewards||[];$('rewardList').innerHTML=a.map(r=>'<div class="row">🎁 <b>'+esc(r.name)+'</b><br><small>'+esc(r.description||'')+' | ⭐ '+Number(r.points_required).toLocaleString('fa-IR')+' امتیاز</small></div>').join('')||'<div class="row">هنوز جایزه‌ای ثبت نشده است.</div>'}catch(e){$('rewardMsg').textContent='❌ '+e.message}}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='⏳ در حال ورود...';try{const x=await api('login',{username:$('username').value.trim(),password:$('password').value});if(!x.session)throw new Error('پاسخ ورود نامعتبر است');session=x.session;sessionStorage.setItem('sima_session',session);$('login').classList.add('hidden');$('app').classList.remove('hidden');show('home')}catch(e){$('loginMsg').textContent='❌ '+e.message}};$('logout').onclick=()=>{session='';sessionStorage.removeItem('sima_session');location.reload()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));$('addClass').onclick=async()=>{try{await api('add_class',{name:$('className').value.trim()});$('className').value='';$('classMsg').textContent='✅ کلاس اضافه شد';loadClasses();loadHome()}catch(e){$('classMsg').textContent='❌ '+e.message}};$('addTeacher').onclick=async()=>{try{await api('add_teacher',{full_name:$('teacherName').value.trim(),username:$('teacherUser').value.trim(),password:$('teacherPass').value});$('teacherMsg').textContent='✅ معلم ثبت شد';loadTeachers();loadHome()}catch(e){$('teacherMsg').textContent='❌ '+e.message}};$('assign').onclick=async()=>{try{const x=await api('assign_teacher',{teacher_id:Number($('teacherSelect').value),class_id:Number($('classSelect').value)});$('assignMsg').textContent='✅ '+x.message;loadTeachers()}catch(e){$('assignMsg').textContent='❌ '+e.message}};$('addReward').onclick=async()=>{try{await api('add_reward',{name:$('rewardName').value.trim(),description:$('rewardDesc').value.trim(),points_required:Number($('rewardPoints').value),image_url:$('rewardImage').value.trim()});$('rewardMsg').textContent='✅ جایزه ثبت شد';$('rewardName').value='';$('rewardDesc').value='';$('rewardPoints').value='';$('rewardImage').value='';loadRewards();loadHome()}catch(e){$('rewardMsg').textContent='❌ '+e.message}};

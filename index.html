<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت مدارس | سامانه جوایز</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f7fb;color:#263238}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eee8ff,#eef9ff)}.box{background:#fff;border-radius:20px;padding:22px;box-shadow:0 6px 25px #0001}.login .box{width:min(430px,92%)}input,button{width:100%;padding:12px;margin:6px 0;border-radius:12px;font:inherit}input{border:1px solid #ddd}button{border:0;background:#765cff;color:#fff;cursor:pointer}.bar{background:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.content{max-width:1200px;margin:auto;padding:24px}.stats,.schools{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.stat{padding:18px}.stat strong{display:block;font-size:30px;margin-top:8px}.school{padding:18px}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#e9f8ee;color:#218344;font-size:12px}.off{background:#f4f4f4;color:#777}.actions{display:flex;gap:8px}.actions button{margin-top:12px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px}.modal .box{width:min(500px,100%)}.msg{min-height:24px}.muted{color:#718096;font-size:13px}</style></head><body><div id="login" class="login"><div class="box"><h1>🎓 سامانه جوایز مدارس</h1><p>ورود مدیر کل</p><form id="loginForm"><input id="username" placeholder="نام کاربری" required><input id="password" type="password" placeholder="رمز عبور" required><button>ورود به داشبورد</button></form><div id="loginMsg" class="msg"></div></div></div><div id="app" class="hidden"><header class="bar"><b>🎓 داشبورد مدیر کل</b><button id="logout" style="width:auto;background:#777">خروج</button></header><main class="content"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><div><h2>🏫 مدیریت مدارس</h2><p class="muted">اطلاعات مستقیم از دیتابیس فعلی خوانده می‌شود.</p></div><button id="add" style="width:auto">➕ افزودن مدرسه</button></div><div class="stats"><div class="box stat">🏫 مدارس<strong id="sc">۰</strong></div><div class="box stat">🏷️ کلاس‌ها<strong id="cc">۰</strong></div><div class="box stat">👨‍🎓 دانش‌آموزان<strong id="stc">۰</strong></div><div class="box stat">👩‍🏫 معلم‌ها<strong id="tc">۰</strong></div><div class="box stat">🎁 جوایز<strong id="rc">۰</strong></div></div><section class="box" style="margin-top:20px"><h2>فهرست مدارس</h2><div id="list" class="schools"></div></section><div id="msg" class="msg"></div></main></div><div id="modal" class="modal hidden"><div class="box"><h2 id="mt">➕ افزودن مدرسه</h2><form id="form"><input type="hidden" id="id"><input id="name" placeholder="نام مدرسه" required><input id="code" placeholder="کد مدرسه" required><div id="admins"><input id="au" placeholder="نام کاربری مدیر مدرسه" required><input id="ap" type="password" placeholder="رمز عبور مدیر مدرسه" required><input id="af" placeholder="نام مدیر مدرسه"></div><div id="fm" class="msg"></div><button>ذخیره</button><button type="button" id="cancel" style="background:#777">انصراف</button></form></div></div><script>const API='https://ubjsvqhxoufdjwzqkmsd.supabase.co/functions/v1/school-api';let token=sessionStorage.getItem('sima_session')||'';const e=id=>document.getElementById(id),fa=n=>Number(n||0).toLocaleString('fa-IR');function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}async function call(action,data={}){const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({error:'پاسخ نامعتبر'}));if(!r.ok)throw Error(j.error||'خطا');return j}async function load(){try{const j=await call('superadmin_schools'),a=j.schools||[];e('sc').textContent=fa(a.length);e('cc').textContent=fa(a.reduce((n,x)=>n+x.classes_count,0));e('stc').textContent=fa(a.reduce((n,x)=>n+x.students_count,0));e('tc').textContent=fa(a.reduce((n,x)=>n+x.teachers_count,0));e('rc').textContent=fa(a.reduce((n,x)=>n+x.rewards_count,0));e('list').innerHTML=a.map(s=>`<article class="box school"><h3>🏫 ${esc(s.name)}</h3><div class="muted">کد: ${esc(s.code)}</div><p><span class="badge ${s.active?'':'off'}">${s.active?'فعال':'غیرفعال'}</span></p><div class="muted">کلاس: ${fa(s.classes_count)} | دانش‌آموز: ${fa(s.students_count)}<br>معلم: ${fa(s.teachers_count)} | جایزه: ${fa(s.rewards_count)}</div><div class="actions"><button onclick='edit(${JSON.stringify(s)})'>✏️ ویرایش</button><button onclick='toggle(${s.id},${!s.active})' style="background:${s.active?'#e55b63':'#777'}">${s.active?'غیرفعال کردن':'فعال کردن'}</button></div></article>`).join('')||'<p>مدرسه‌ای ثبت نشده است.</p>'}catch(x){e('msg').textContent='❌ '+x.message}}function openAdd(){e('mt').textContent='➕ افزودن مدرسه';e('id').value='';e('name').value='';e('code').value='';e('au').value='';e('ap').value='';e('af').value='';e('admins').classList.remove('hidden');e('au').required=e('ap').required=true;e('fm').textContent='';e('modal').classList.remove('hidden')}window.edit=s=>{e('mt').textContent='✏️ ویرایش مدرسه';e('id').value=s.id;e('name').value=s.name;e('code').value=s.code;e('admins').classList.add('hidden');e('au').required=e('ap').required=false;e('fm').textContent='';e('modal').classList.remove('hidden')};window.toggle=async(id,active)=>{if(!confirm(active?'مدرسه فعال شود؟':'مدرسه غیرفعال شود؟'))return;try{await call('superadmin_update_school',{id,active});load()}catch(x){alert(x.message)}};e('add').onclick=openAdd;e('cancel').onclick=()=>e('modal').classList.add('hidden');e('form').onsubmit=async x=>{x.preventDefault();e('fm').textContent='⏳ در حال ذخیره...';try{if(e('id').value)await call('superadmin_update_school',{id:Number(e('id').value),name:e('name').value,code:e('code').value});else await call('superadmin_add_school',{name:e('name').value,code:e('code').value,username:e('au').value,password:e('ap').value,full_name:e('af').value});e('modal').classList.add('hidden');load()}catch(x){e('fm').textContent='❌ '+x.message}};e('loginForm').onsubmit=async x=>{x.preventDefault();e('loginMsg').textContent='⏳ در حال ورود...';try{const j=await call('admin_login',{username:e('username').value,password:e('password').value});if(!j.token)throw Error('ورود انجام نشد');token=j.token;sessionStorage.setItem('sima_session',token);e('login').classList.add('hidden');e('app').classList.remove('hidden');load()}catch(x){e('loginMsg').textContent='❌ '+x.message}};e('logout').onclick=()=>{sessionStorage.removeItem('sima_session');location.reload()};if(token){e('login').classList.add('hidden');e('app').classList.remove('hidden');load()}</script></body></html>

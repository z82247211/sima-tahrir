<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMA TAHRIR</title><style>body{font-family:Tahoma,Arial;margin:0;background:#f7f3ff;color:#263238}.box{background:#fff;border-radius:20px;padding:25px;box-shadow:0 8px 30px #0001}.login{min-height:100vh;display:grid;place-items:center}.login .box{width:min(400px,90%)}input,button{width:100%;padding:12px;margin:7px 0;border-radius:12px;font:inherit;box-sizing:border-box}input{border:1px solid #ddd}button{border:0;background:#765cff;color:#fff;cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.bar{background:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}.content{max-width:1100px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.msg{min-height:24px;font-size:14px}.reward{padding:15px;border:1px solid #eee;border-radius:15px;background:#fff;text-align:center}.reward img{width:120px;height:120px;object-fit:contain}</style></head><body><div id="login" class="login"><div class="box"><h1>🎁 SIMA TAHRIR</h1><p>سامانه هوشمند امتیاز و جوایز</p><form id="loginForm"><input id="username" placeholder="نام کاربری" autocomplete="username" required><input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password" required><button type="submit">ورود به پنل</button></form><div id="loginMsg" class="msg"></div></div></div><div id="app" class="app hidden"><header class="bar"><b>🎁 SIMA TAHRIR</b><button id="logout" style="width:auto;padding:8px 18px;background:#777">خروج</button></header><main class="content"><h2>پنل مدیریت</h2><div class="grid"><div class="box"><h3>🏷️ کلاس‌ها</h3><strong id="classesCount">۰</strong></div><div class="box"><h3>👩‍🏫 معلم‌ها</h3><strong id="teachersCount">۰</strong></div><div class="box"><h3>👨‍🎓 دانش‌آموزان</h3><strong id="studentsCount">۰</strong></div><div class="box"><h3>🎁 جوایز</h3><strong id="rewardsCount">۰</strong></div></div><section class="box" style="margin-top:20px"><h2>🎁 جوایز</h2><div id="rewardsList" class="grid"></div></section></main></div><script>const API='https://znisrmcilqzjicmfsype.supabase.co/functions/v1/sima-tahrir-api';let token='';const el=id=>document.getElementById(id);async function call(action,data){const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const res=await fetch(API,{method:'POST',headers,body:JSON.stringify(Object.assign({action},data||{}))});const json=await res.json().catch(()=>({error:'پاسخ نامعتبر از سرور'}));if(!res.ok)throw new Error(json.error||'خطا');return json}async function load(){try{const [c,t,s,r]=await Promise.all([call('classes'),call('teachers'),call('students',{page:1,page_size:1}),call('rewards')]);el('classesCount').textContent=(c.classes||[]).length.toLocaleString('fa-IR');el('teachersCount').textContent=(t.teachers||[]).length.toLocaleString('fa-IR');el('studentsCount').textContent=Number(s.total||0).toLocaleString('fa-IR');el('rewardsCount').textContent=(r.rewards||[]).length.toLocaleString('fa-IR');el('rewardsList').innerHTML=(r.rewards||[]).map(x=>'<div class="reward">'+(x.image_url?'<img src="'+x.image_url+'">':'<div style="font-size:55px">🎁</div>')+'<h3>'+String(x.name||'')+'</h3><p>'+String(x.description||'')+'</p><b>⭐ '+Number(x.points_required||0).toLocaleString('fa-IR')+' امتیاز</b></div>').join('')||'<p>هنوز جایزه‌ای ثبت نشده است.</p>'}catch(e){console.error(e)}}el('loginForm').addEventListener('submit',async function(e){e.preventDefault();el('loginMsg').textContent='⏳ در حال ورود...';try{const x=await call('login',{username:el('username').value,password:el('password').value});if(!x.ok||!x.session)throw new Error(x.error||'ورود انجام نشد');token=x.session;sessionStorage.setItem('sima_session',token);el('login').classList.add('hidden');el('app').classList.remove('hidden');el('loginMsg').textContent='';await load()}catch(e){el('loginMsg').textContent='❌ '+e.message}});el('logout').addEventListener('click',function(){token='';sessionStorage.removeItem('sima_session');location.reload()});</script></body></html>
